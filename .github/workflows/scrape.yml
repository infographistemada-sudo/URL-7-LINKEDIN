name: Extraction automatique

on:
  # Se relance automatiquement toutes les 15 minutes.
  # GitHub peut retarder légèrement les cron sur les repos gratuits.
  schedule:
    - cron: "*/15 * * * *"
  # Permet aussi de lancer le script manuellement depuis l'onglet Actions.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scraping-auto
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation des dépendances
        run: npm install

      - name: Lancer l'extraction
        run: npm run scrape
        timeout-minutes: 8
        env:
          TIME_LIMIT_MS: "240000"
          DELAY_MS: "300"
          FETCH_TIMEOUT_MS: "15000"

      - name: Commit et push des résultats
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Mise à jour automatique des données extraites"
          file_pattern: "data/leads.csv"
